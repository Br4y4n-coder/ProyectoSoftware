########## BASE DE DATOS H2 EN MEMORIA (TESTS) ##########
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

########## JWT ##########
app.jwt.secret=claveSuperSecretaParaTestsDeJUnit1234567890abc
app.jwt.issuer=SIT-Test
app.jwt.access-expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.jwt.verify-email-expiration-ms=86400000
app.jwt.reset-password-expiration-ms=3600000
jwt.secret=claveSuperSecretaParaTestsDeJUnit1234567890abc

########## SEGURIDAD ##########
app.security.max-intentos-fallidos=5
app.security.bloqueo-minutos=30

########## FRONTEND ##########
app.frontend.url=http://localhost:5173

########## BREVO (stub en tests) ##########
brevo.api-key=dummy_key_test
brevo.api-url=http://localhost:9999
brevo.sender.email=no-reply@test.com
brevo.sender.name=SIT_Test

########## CORS ##########
app.cors.allowed-origins=http://localhost:5173

########## LOGGING ##########
logging.level.com.proyectoarquitectura=WARN
logging.level.org.springframework.security=WARN
